<!doctype html>
<!-- DOCTYPE: Δήλωση HTML5 για σωστό rendering & πρότυπα -->
<html lang="el">
<!-- lang="el": Ορίζει γλώσσα εγγράφου για SEO/προσβασιμότητα -->

<head>
  <meta charset="utf-8"/>
  <!-- UTF-8: Υποστήριξη ελληνικών χαρακτήρων -->

  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <!-- Responsive meta: Κλίμακα/viewport για κινητά & tablets -->

  <title>Πίνακας Ελέγχου · Μηχανικός · AutoFix</title>
  <!-- Τίτλος σελίδας: εμφανίζεται στο tab/ιστορικό/SEO -->

  <link rel="stylesheet" href="/css/style.css"/>
  <link rel="stylesheet" href="/css/dash.css"/>
  <!-- CSS: Βασικά styles + ειδικά dashboard. Το δεύτερο μπορεί να υπερκαλύψει κανόνες του πρώτου. -->

  <script defer src="/js/api.js"></script>
  <!-- api.js: Κοινές κλήσεις προς backend (fetch/AJAX), helpers -->

  <script defer src="/js/auth-guard.js"></script>
  <!-- auth-guard.js: Έλεγχος session/JWT, πιθανό redirect αν δεν υπάρχει login -->

  <script defer src="/js/mechanic.js"></script>
  <!-- mechanic.js: Λογική της σελίδας μηχανικού (φόρτωση ραντεβού/οχημάτων, φίλτρα, modals, handlers) -->
  <!-- defer: Τα scripts εκτελούνται μετά το parsing του DOM χωρίς να μπλοκάρουν το rendering -->
</head>

<body>
  <!-- NAVBAR: Γραμμή πλοήγησης χρήστη (ρόλος: Μηχανικός) -->
  <div class="navbar">
    <a class="brand" href="/" aria-label="Αρχική σελίδα">
      <!-- aria-label: Περιγραφή προορισμού για screen readers -->
      <img class="brand-logo" src="/img/logo.png" alt="AutoFix logo">
      <!-- alt: Περιγραφή λογότυπου για προσβασιμότητα -->
      <span>Μηχανουργείο AutoFix</span>
    </a>

    <div style="display:flex;gap:8px;align-items:center">
      <a class="btn ghost" href="/dashboard/mechanic-profile.html">Προφίλ</a>
      <!-- Σύνδεσμος στο προφίλ μηχανικού -->

      <span class="badge" id="navUser">—</span>
      <!-- navUser: Θα ενημερωθεί δυναμικά (όνομα/ρόλος/σύντομο id) από JS -->

      <button class="btn ghost" data-action="logout">Αποσύνδεση</button>
      <!-- data-action="logout": Το JS κάνει bind handler για αποσύνδεση -->
    </div>
  </div>

  <main class="main">
    <h1 class="page-title">Πίνακας Ελέγχου (Μηχανικός)</h1>
    <!-- Κύριος τίτλος σελίδας -->

    <!-- ΦΙΛΤΡΑ: Ημερομηνία + Κατάσταση + Καθαρισμός -->
    <section class="card" style="margin-bottom:12px;">
      <div class="card-head"><h3>Φίλτρα</h3></div>

      <div class="grid cols-3" style="gap:8px">
        <div>
          <label class="small">Ημερομηνία</label>
          <input id="dateFilter" class="input" type="date"/>
          <!-- dateFilter: Φιλτράρει ραντεβού με βάση την ημερομηνία (handled από mechanic.js) -->
        </div>

        <div>
          <label class="small">Κατάσταση</label>
          <select id="statusFilter" class="input">
            <option value="">Όλες</option>
            <option value="CREATED">Δημιουργημένο</option>
            <option value="IN_PROGRESS">Σε εξέλιξη</option>
            <option value="COMPLETED">Περατωμένο</option>
            <option value="CANCELED">Ακυρωμένο</option>
          </select>
          <!-- statusFilter: Επιλογή κατάστασης ραντεβού. Ο χάρτης τιμών πρέπει να συμφωνεί με backend enums. -->
        </div>

        <div style="align-self:end">
          <button id="btnClear" class="btn ghost">Καθαρισμός</button>
          <!-- btnClear: Καθαρίζει τα φίλτρα & επαναφορτώνει λίστα (μηδενισμός date/status) -->
        </div>
      </div>
    </section>

    <!-- ΛΙΣΤΑ ΡΑΝΤΕΒΟΥ: Πίνακας/κάρτες ραντεβού του μηχανικού -->
    <section class="card">
      <div class="card-head"><h3>Τα ραντεβού μου</h3></div>
      <div id="apptGrid"></div>
      <!-- apptGrid: Placeholder όπου το JS θα κάνει render δυναμικά τα ραντεβού με βάση φίλτρα -->
    </section>

    <!-- ΛΙΣΤΑ ΟΧΗΜΑΤΩΝ: Μόνο προβολή (χωρίς επεξεργασία από τον μηχανικό) -->
    <section class="card" style="margin-top:12px">
      <div class="card-head"><h3>Τα οχήματά μου (μόνο προβολή)</h3></div>
      <div id="vehList"></div>
      <!-- vehList: Placeholder για συνοπτική λίστα οχημάτων σχετικών με τα ραντεβού -->
    </section>

    <div class="toast hidden"></div>
    <!-- toast: Περιοχή για προσωρινά μηνύματα επιτυχίας/σφάλματος. Θα εμφανίζεται/κρύβεται από JS. -->
  </main>

  <!-- MODAL ΠΡΟΣΘΗΚΗΣ ΕΡΓΑΣΙΑΣ: Δημιουργία/προσθήκη εργασίας σε ραντεβού -->
  <div id="workModal" class="modal" aria-hidden="true">
    <!-- aria-hidden="true": Η modal ξεκινά κρυφή για αναγνώστες οθόνης/εστίαση -->
    <!-- Προσβασιμότητα (σύσταση): Θα μπορούσε να προστεθεί role="dialog" και aria-labelledby="workTitle" (στο HTML δεν αλλάζουμε τη λογική) -->

    <div class="modal__dialog">
      <div class="modal__head">
        <h3 id="workTitle">Νέα εργασία</h3>
        <button id="workClose" class="modal__close" aria-label="Κλείσιμο">×</button>
        <!-- workClose: Κουμπί κλεισίματος modal. Το JS κάνει toggle/close. -->
      </div>

      <form id="workForm" class="modal__body" data-id="">
        <!-- workForm: Η αποθήκευση γίνεται από JS (preventDefault -> API call).
             data-id: Χρησιμοποιείται για edit mode (π.χ. άδειο για νέα, συγκεκριμένο id για επεξεργασία). -->

        <div class="grid cols-2" style="gap:10px">
          <div class="field" style="grid-column:1/-1">
            <label class="small">Περιγραφή</label>
            <input class="input" name="description" required placeholder="π.χ. Αλλαγή λαδιών">
            <!-- description: Υποχρεωτικό. Μικρή περιγραφή εργασίας που θα τιμολογηθεί/καταγραφεί -->
          </div>

          <div class="field">
            <label class="small">Υλικά (προαιρετικό)</label>
            <input class="input" name="materials" placeholder="π.χ. Φίλτρο λαδιού">
            <!-- materials: Προαιρετικό πεδίο για αναλωσίμα/ανταλλακτικά (comma-separated ή ελεύθερο κείμενο) -->
          </div>

          <div class="field">
            <label class="small">Κόστος (€)</label>
            <input class="input" name="cost" type="number" step="0.01" min="0" required>
            <!-- cost: Αριθμητικό, δύο δεκαδικά (step 0.01), μη αρνητικό (min 0). Ο server πρέπει να επαληθεύει/στρογγυλοποιεί. -->
          </div>
        </div>

        <div style="text-align:right;margin-top:10px">
          <button type="button" class="btn ghost" id="btnWorkCancel">Άκυρο</button>
          <!-- btnWorkCancel: Κλείνει modal χωρίς αποθήκευση -->

          <button class="btn" id="btnWorkSave">Αποθήκευση</button>
          <!-- btnWorkSave: Trigger για submit. Το JS θα κάνει intercept (submit/click) και θα καλέσει το API. -->
        </div>
      </form>
    </div>
  </div>
</body>
</html>
